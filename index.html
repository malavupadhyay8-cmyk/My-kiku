<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For My Queen 🧸🍫❤️</title>
<style>
body {
background-color: #ffb3c1;
background-size: cover;
background-position: center;
font-family: 'Arial', sans-serif;
display: flex;
justify-content: center;
align-items: center;
min-height: 100vh;
margin: 0;
overflow: hidden;
transition: background 0.5s ease;
}
.container {
background: rgba(255, 255, 255, 0.95);
padding: 30px;
border-radius: 30px;
box-shadow: 0 10px 30px rgba(201, 24, 74, 0.3);
text-align: center;
max-width: 400px;
width: 85%;
border: 5px solid #ff4d6d;
position: relative;
z-index: 10;
}
h1 { color: #c9184a; font-size: 22px; line-height: 1.4; margin: 15px 0; }
.main-btn {
background: linear-gradient(45deg, #ff4d6d, #ff758f);
color: white;
border: none;
padding: 15px 25px;
font-size: 16px;
border-radius: 50px;
cursor: pointer;
margin: 8px;
box-shadow: 0 4px 15px rgba(255, 77, 109, 0.4);
width: 80%;
}
.couple-photo { width: 100%; border-radius: 20px; margin-top: 15px; border: 3px solid #ffb3c1; }
#noBtn { background-color: #adb5bd; width: auto; position: relative; }
.emoji-bar { font-size: 28px; margin: 10px 0; }
</style>
</head>
<body>

<audio id="bg-music" loop>
<source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3" type="audio/mpeg">
</audio>

<div class="container" id="content">
<div class="emoji-bar">🧸 🍫 💋 🧸</div>
<h1>My love, I will always go above and beyond just to make you happy babe. ❤️</h1>
<button class="main-btn" onclick="startEverything()">Start the Quiz ❤️</button>
<div class="emoji-bar">🌹 ✨ 💘 🌹</div>
</div>

<script>
function startEverything() {
const music = document.getElementById('bg-music');
music.play().catch(() => console.log("Mute switch is ON"));
document.body.style.backgroundImage = "url('https://i.pinimg.com/originals/1b/30/41/1b304107149a4f6643666d93335555d4.gif')";
questionOne();
}

function questionOne() {
document.getElementById('content').innerHTML = `
<div class="emoji-bar">🍫 💖 🍫</div>
<h1>Who loves you the most?</h1>
<button class="main-btn" onclick="questionTwo()">You do! 🥰</button>
<button class="main-btn" onclick="questionTwo()">Definitely you ❤️</button>
`;
}

function questionTwo() {
document.getElementById('content').innerHTML = `
<div class="emoji-bar">🧸 💋 🧸</div>
<h1>Am I your favorite person?</h1>
<button class="main-btn" onclick="questionThree()">YES! 💘</button>
<button class="main-btn" onclick="questionThree()">Always 💋</button>
`;
}

function questionThree() {
document.getElementById('content').innerHTML = `
<div class="emoji-bar">🍭 🌹 🍭</div>
<h1>Do you know how much I love you?</h1>
<button class="main-btn" onclick="finalPage()">A LOT! 🥰</button>
<button class="main-btn" onclick="finalPage()">Infinity! ♾️</button>
`;
}

function finalPage() {
document.getElementById('content').innerHTML = `
<div class="emoji-bar">🍫 💘 🍫</div>
<h1>Final Question... <br> Will you be my Valentine? ❤️</h1>
<button id="yesBtn" class="main-btn" style="width: auto;">YES! 🥰</button>
<button id="noBtn" class="main-btn" onmouseover="moveNo()" ontouchstart="moveNo()">NO 😢</button>
`;

document.getElementById('yesBtn').onclick = () => {
document.getElementById('content').innerHTML = `
<div class="emoji-bar">💖 ✨ 🍫 🧸 💖</div>
<h1>Yay! I love you so much! 💋✨</h1>
<img src="final.jpg" class="couple-photo">
<p style="margin-top:15px; color:#c9184a; font-weight:bold;">Forever & Always! 💘</p>
`;
};
}

function moveNo() {
const btn = document.getElementById('noBtn');
const x = Math.random() * (window.innerWidth - btn.offsetWidth);
const y = Math.random() * (window.innerHeight - btn.offsetHeight);
btn.style.position = 'fixed';
btn.style.left = x + 'px';
btn.style.top = y + 'px';
}
</script>
</body>
</html>
