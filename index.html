<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For My Queen 🧸🍫❤️</title>
<style>
body {
background-color: #ffb3c1;
background-size: cover;
background-position: center;
font-family: 'Arial', sans-serif;
display: flex;
justify-content: center;
align-items: center;
min-height: 100vh;
margin: 0;
overflow: hidden;
transition: background 0.5s ease;
}
.container {
background: rgba(255, 255, 255, 0.95);
padding: 25px;
border-radius: 30px;
box-shadow: 0 10px 30px rgba(201, 24, 74, 0.3);
text-align: center;
max-width: 420px;
width: 85%;
border: 5px solid #ff4d6d;
position: relative;
z-index: 10;
}
h1 { color: #c9184a; font-size: 20px; line-height: 1.4; margin: 10px 0; }
.main-btn {
background: linear-gradient(45deg, #ff4d6d, #ff758f);
color: white;
border: none;
padding: 12px 20px;
font-size: 16px;
border-radius: 50px;
cursor: pointer;
margin: 8px auto;
display: block;
width: 90%;
box-shadow: 0 4px 15px rgba(255, 77, 109, 0.3);
}
.couple-photo { width: 100%; border-radius: 20px; margin-top: 15px; border: 3px solid #ffb3c1; }
.animal-gif { width: 150px; border-radius: 15px; margin: 10px 0; }
.emoji-bar { font-size: 24px; margin: 5px 0; }
#noBtn { width: auto; display: inline-block; background: #808080; }
</style>
</head>
<body>

<audio id="bg-music" loop>
<source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3" type="audio/mpeg">
</audio>

<div class="container" id="content">
<div class="emoji-bar">🧸 🍫 💋 🧸</div>
<h1>My love, I will always go above and beyond just to make you happy babe. ❤️</h1>
<button class="main-btn" onclick="startEverything()">Start the Quiz ❤️</button>
<div class="emoji-bar">🌹 ✨ 💘 🌹</div>
</div>

<script>
function startEverything() {
const music = document.getElementById('bg-music');
music.play().catch(() => console.log("Sound muted"));
document.body.style.backgroundImage = "url('https://i.pinimg.com/originals/1b/30/41/1b304107149a4f6643666d93335555d4.gif')";

document.getElementById('content').innerHTML = `
<div class="emoji-bar">🐾 ✨ 🐾</div>
<h1>Let's begin the hard questions...</h1>
<img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExNHJueGZueGZueGZueGZueGZueGZueGZueGZueGZueGZueGZueGZ1JmVwPXYxX2ludGVybmFsX2dpZl9ieV9pZCZjdD1n/M90mJvCqxJvG/giphy.gif" class="animal-gif">
<button class="main-btn" onclick="questionOne()">I'm Ready! 🥰</button>
`;
}

function questionOne() {
document.getElementById('content').innerHTML = `
<div class="emoji-bar">🏠 ❤️ 🏠</div>
<h1>1) Our fav place?</h1>
<button class="main-btn" onclick="alert('Try again babe! 😘')">A - Forks</button>
<button class="main-btn" onclick="alert('Almost! 😉')">B - Red Swan</button>
<button class="main-btn" onclick="questionTwo()">C - Cuddle on your bed 🥰</button>
`;
}

function questionTwo() {
document.getElementById('content').innerHTML = `
<div class="emoji-bar">💍 ✨ 💍</div>
<h1>2) Where did I propose to you?</h1>
<button class="main-btn" onclick="questionThree()">A - St Vital Mall</button>
<button class="main-btn" onclick="questionThree()">B - Polo Park</button>
<button class="main-btn" onclick="questionThree()">C - Outlet Mall</button>
`;
}

function questionThree() {
document.getElementById('content').innerHTML = `
<div class="emoji-bar">🌌 💖 🌌</div>
<h1>3) How much do I love you?</h1>
<button class="main-btn" onclick="alert('Think bigger! ❤️')">A - A little</button>
<button class="main-btn" onclick="alert('More than that! 😘')">B - Tons</button>
<button class="main-btn" onclick="finalPage()">C - Infinite and beyond galaxies ♾️</button>
`;
}

function finalPage() {
document.getElementById('content').innerHTML = `
<div class="emoji-bar">🍫 🧸 🍫</div>
<h1>Final Question... <br> Will you be my Valentine? ❤️</h1>
<div style="display: flex; justify-content: center; gap: 10px;">
<button id="yesBtn" class="main-btn" style="width: auto;">YES! 🥰</button>
<button id="noBtn" class="main-btn" onmouseover="moveNo()" ontouchstart="moveNo()">NO 😢</button>
</div>
`;

document.getElementById('yesBtn').onclick = () => {
document.getElementById('content').innerHTML = `
<div class="emoji-bar">💖 ✨ 🍫 🧸 💖</div>
<h1>Yay! I love you so much! 💋✨</h1>
<img src="final.jpg" class="couple-photo">
<p style="margin-top:15px; color:#c9184a; font-weight:bold;">Forever & Always! 💘</p>
`;
};
}

function moveNo() {
const btn = document.getElementById('noBtn');
const x = Math.random() * (window.innerWidth - btn.offsetWidth);
const y = Math.random() * (window.innerHeight - btn.offsetHeight);
btn.style.position = 'fixed';
btn.style.left = x + 'px';
btn.style.top = y + 'px';
}
</script>
</body>
</html>
