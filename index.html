<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For My Queen</title>
<style>
body {
background-color: #ffb3c1;
background-size: cover;
background-position: center;
font-family: 'Arial', sans-serif;
display: flex;
justify-content: center;
align-items: center;
height: 100vh;
margin: 0;
overflow: hidden;
transition: background 0.5s ease;
}
.container {
background: rgba(255, 255, 255, 0.9);
padding: 30px;
border-radius: 20px;
box-shadow: 0 10px 30px rgba(0,0,0,0.1);
text-align: center;
max-width: 400px;
width: 90%;
border: 5px solid #ff4d6d;
}
h1 { color: #c9184a; font-size: 22px; margin-bottom: 20px; }
.main-btn {
background-color: #ff4d6d;
color: white;
border: none;
padding: 15px 30px;
font-size: 18px;
border-radius: 50px;
cursor: pointer;
margin: 10px;
transition: transform 0.2s;
}
.main-btn:hover { transform: scale(1.1); }
.couple-photo { width: 100%; border-radius: 15px; margin-top: 15px; display: block; }
#noBtn { background-color: #808080; color: white; border: none; padding: 10px 20px; border-radius: 50px; cursor: pointer; position: relative; }
</style>
</head>
<body>

<audio id="bg-music" loop>
<source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3" type="audio/mpeg">
</audio>

<div class="container" id="content">
<h1>My love, I will always go above and beyond just to make you happy babe. ❤️</h1>
<div class="btn-group">
<button class="main-btn" onclick="startEverything()">Start the Quiz ❤️</button>
</div>
</div>

<script>
function startEverything() {
// Trigger music on button tap
const music = document.getElementById('bg-music');
music.play().catch(() => console.log("Check physical silent switch!"));

// Set Capybara background
document.body.style.backgroundImage = "url('https://i.pinimg.com/originals/1b/30/41/1b304107149a4f6643666d93335555d4.gif')";

showChallenge();
}

function showChallenge() {
document.getElementById('content').innerHTML = `
<h1>Quick Question...</h1>
<p>Do you know how much I love you?</p>
<button class="main-btn" onclick="finalPage()">A LOT! 🥰</button>
`;
}

function finalPage() {
document.getElementById('content').innerHTML = `
<h1>Final Question... <br> Will you be my Valentine? ❤️</h1>
<div class="btn-group">
<button id="yesBtn" class="main-btn">YES! 🥰</button>
<button id="noBtn" onmouseover="moveNo()" ontouchstart="moveNo()">NO 😢</button>
</div>
`;

document.getElementById('yesBtn').onclick = () => {
document.getElementById('content').innerHTML = `
<h1>Yay! I love you so much! 💖✨</h1>
<img src="IMG_9698" class="couple-photo">
<p style="margin-top:15px; color:#c9184a; font-weight:bold;">Forever & Always!</p>
`;
};
}

function moveNo() {
const btn = document.getElementById('noBtn');
const x = Math.random() * (window.innerWidth - btn.offsetWidth);
const y = Math.random() * (window.innerHeight - btn.offsetHeight);
btn.style.position = 'fixed';
btn.style.left = x + 'px';
btn.style.top = y + 'px';
}
</script>
</body>
</html>
